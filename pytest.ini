[pytest]
testpaths = tests
pythonpath = .
addopts = --strict-markers --browser chromium --base-url https://www.saucedemo.com --tracing retain-on-failure --screenshot only-on-failure --html=artifacts/report.html --self-contained-html
markers =
    smoke: essential primary journey and validation checks
    regression: repeatable functional coverage
    p0: critical priority
    p1: high priority
    p2: medium priority
    p3: low priority
    manual_script(id): source manual script identifier
    evidence: observations and screenshots, not a complete functional or visual verdict
    coverage_gap(id): gap identifier from docs/coverage-gap-analysis.md
    observed_baseline: current application behavior; intended business rule is unconfirmed
    visual: screenshot comparisons against explicitly recorded environment-specific baselines
